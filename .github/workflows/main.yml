name: Nivesh Niti Free Daily Updates

on:
  schedule:
    # 9:10 AM IST (03:40 AM UTC) - Monday to Friday
    - cron: '40 3 * * 1-5'
    # 6:30 PM IST (13:00 UTC) - Monday to Friday
    - cron: '00 13 * * 1-5'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Which report to run manually?'
        required: true
        default: 'evening'
        type: choice
        options:
          - morning
          - evening

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Report (9:10 AM IST)
        # Fires ONLY when the morning cron triggers, or manual override
        if: |
          github.event.schedule == '40 3 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'morning')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "☀️ Starting Morning Opening Pulse..."
          python morning_report.py

      - name: Run Evening Report (6:30 PM IST)
        # Fires ONLY when the evening cron triggers, or manual override, or push
        if: |
          github.event.schedule == '00 13 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'evening') ||
          github.event_name == 'push'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "☕ Starting Evening Closing Bell..."
          python evening_report.py
