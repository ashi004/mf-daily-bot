name: Nivesh Niti Free Daily Updates

on:
  schedule:
    - cron: '40 3 * * 1-5'   # 9:10 AM IST  Mon-Fri
    - cron: '00 13 * * 1-5'  # 6:30 PM IST  Mon-Fri
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Which report to run?'
        required: true
        default: 'evening'
        type: choice
        options:
          - morning
          - evening

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fixes Node.js deprecation warning

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning Report (9:10 AM IST)
        if: |
          github.event.schedule == '40 3 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'morning')
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "☀️ Running Morning Report..."
          python morning_report.py

      - name: Run Evening Report (6:30 PM IST)
        if: |
          github.event.schedule == '00 13 * * 1-5' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.report_type == 'evening') ||
          github.event_name == 'push'
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "☕ Running Evening Report..."
          python evening_report.py
