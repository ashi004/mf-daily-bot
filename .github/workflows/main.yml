name: Nivesh Niti Daily Bot

on:
  schedule:
    - cron: '30 3 * * *'  # 9:00 AM IST
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This solves the Node.js 24 warning globally for this run
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      # Updated to v4 (latest stable)
      - name: Checkout code
        uses: actions/checkout@v4 

      # Updated to v5 (Supports Node 24 and better caching)
      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11' # Upgraded for compatibility

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py