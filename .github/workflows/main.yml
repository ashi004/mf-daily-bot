name: Nivesh Niti Free Daily Updates

on:
  schedule:
    # 9:10 AM IST (03:40 AM UTC) - Monday to Friday
    - cron: '40 3 * * 1-5'
    # 6:00 PM IST (12:30 PM UTC) - Monday to Friday
    - cron: '30 12 * * 1-5'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Market Update
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Get the current hour in UTC
          HOUR=$(date +%H)
          
          # If the hour is 03 (UTC), it's the 9:10 AM IST run
          if [ "$HOUR" -eq 03 ] || [ "$HOUR" -eq 04 ]; then
            echo "☀️ Starting Morning Opening Pulse..."
            python morning_report.py
          # If the hour is 12 (UTC), it's the 6:00 PM IST run
          else
            echo "☕ Starting Evening Closing Bell..."
            python evening_report.py
          fi