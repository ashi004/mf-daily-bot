name: Nivesh Niti Premium Alpha

on:
  schedule:
    - cron: '15 13 * * 1-5' # 6:45 PM IST Mon-Fri
  workflow_dispatch: # Allow manual run

jobs:
  run-premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Post Premium Alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PREMIUM_CHAT_ID: ${{ secrets.PREMIUM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python premium_deals.py