name: Nivesh Niti Premium — AI Sentiment

on:
  schedule:
    # 9:00 AM IST  (03:30 UTC) Mon-Fri
    - cron: '30 3 * * 1-5'
    # 12:30 PM IST (07:00 UTC) Mon-Fri
    - cron: '0 7 * * 1-5'
    # 4:30 PM IST  (11:00 UTC) Mon-Fri
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  sentiment-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Sentiment Scan
        env:
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          PREMIUM_CHAT_ID: ${{ secrets.PREMIUM_CHAT_ID }}
          HF_TOKEN:        ${{ secrets.HF_TOKEN }}
        run: python premium_sentiment.py
