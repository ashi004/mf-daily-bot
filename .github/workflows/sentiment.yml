name: Nivesh Niti Premium Sentiment

on:
  schedule:
    - cron: '30 3,7,11 * * 1-5' # 9:00 AM, 12:30 PM, 4:30 PM IST
  workflow_dispatch:

jobs:
  sentiment-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run AI Sentiment Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PREMIUM_CHAT_ID: ${{ secrets.PREMIUM_CHAT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python premium_sentiment.py