name: Market Intelligence Bot (Weekday Extra)

# This workflow runs bot.py only on WEEKDAYS at 5:30 PM IST.
# Weekend runs are REMOVED here — they caused the 11 AM Closing Bell issue.
# If you want a weekend digest, add a separate weekend workflow.

on:
  schedule:
    # Weekdays (Mon–Fri): 5:30 PM IST (12:00 UTC)
    - cron: '0 12 * * 1-5'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the script
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CHANNEL_ID:  ${{ secrets.TEST_CHANNEL_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py
